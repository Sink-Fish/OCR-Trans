<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OCR Trans 0.4.0 logo (ink blue), kept for comparison. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFDFE"/>
      <stop offset="1" stop-color="#EEF0F4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1020" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 body centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="183.5" fill="none" stroke="#0B1020" stroke-opacity="0.08"/>
  <!-- selection corner brackets, ink blue -->
  <g fill="none" stroke="#3456A6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 382V292a30 30 0 0 1 30-30h90"/>
    <path d="M642 262h90a30 30 0 0 1 30 30v90"/>
    <path d="M762 642v90a30 30 0 0 1-30 30h-90"/>
    <path d="M382 762h-90a30 30 0 0 1-30-30v-90"/>
  </g>
  <!-- geometric 文: dot, bar, two crossing sweeps -->
  <g fill="none" stroke="#23262F" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 330v44"/>
    <path d="M384 432h256"/>
    <path d="M598 432C576 560 498 652 384 704"/>
    <path d="M430 432C452 560 530 652 644 704"/>
  </g>
</svg>
