name: Verify published Windows installer
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  installed:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.release.assets.*.name, ','), '_x64-setup.exe')
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify installer and exercise its bundled offline translator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Source tag and installer version differ' }
          $name = "OCR-Trans_${version}_x64-setup.exe"
          gh release download $env:RELEASE_TAG -R $env:GITHUB_REPOSITORY -p $name -p SHA256SUMS.txt -D $env:RUNNER_TEMP
          $expected = Get-Content "$env:RUNNER_TEMP/SHA256SUMS.txt" | Where-Object { $_.EndsWith("  $name") }
          $hash = (Get-FileHash "$env:RUNNER_TEMP/$name" -Algorithm SHA256).Hash
          if ($expected -ne "$hash  $name") { throw 'Installer checksum mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'OCRTransInstalled'
          $setup = Start-Process "$env:RUNNER_TEMP/$name" -ArgumentList "/S /D=$dest" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          ./scripts/verify_windows.ps1 -ExpectedVersion $version -AppPath "$dest/ocr-trans.exe" -ModelsDir "$dest/models" -FastOnly -Screenshot testdata/en_small.png -OutputDir "$env:RUNNER_TEMP/ocrtrans-result"
