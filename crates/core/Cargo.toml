[package]
name = "ocrtrans-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
ct2rs = { version = "0.10.2", default-features = false, features = ["sentencepiece", "ruy"], optional = true }
sentencepiece = { version = "0.13", optional = true }
image = "0.25"
# OCR uses contours and geometric transforms. Text is drawn by the webview; do not
# pull in the unused font parser or FFT stack through imageproc's defaults.
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
llama-cpp-2 = { version = "0.1.160", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { version = "0.10.2", default-features = false, features = ["sentencepiece", "ruy", "accelerate"], optional = true }
llama-cpp-2 = { version = "0.1.160", optional = true, default-features = false, features = ["metal"] }

# Windows uses the same Ruy GEMM backend (int8 + float32 on x86 AVX/AVX2/AVX-512, Apache-2.0) as the base entry
# above. Intel oneMKL would be faster but its prebuilt crate cannot be built from macOS (cross-compiling with
# cargo-xwin) and brings Intel's proprietary redistribution licence into the installer.
#
# llama.cpp on Windows: its backends are separate DLLs loaded at run time (llm.rs) — the CPU code built for several
# instruction sets (SSE4.2 … AVX-512, the best one for the processor is picked; a cross build has no "native" CPU,
# and 0.6.0 ran on plain SSE2) and Vulkan for GPUs. Needs a Vulkan SDK layout at build time (scripts/build_windows.sh).
[target.'cfg(target_os = "windows")'.dependencies]
llama-cpp-2 = { version = "0.1.160", optional = true, default-features = false, features = ["dynamic-backends", "vulkan"] }

[features]
default = ["nmt", "llm"]
# fast tier: CTranslate2 + SentencePiece (native C++)
nmt = ["dep:ct2rs", "dep:sentencepiece"]
# high-quality tier: Qwen3 GGUF through llama.cpp
llm = ["dep:llama-cpp-2"]
