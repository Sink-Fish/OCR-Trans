[workspace]
resolver = "2"
members = ["src-tauri", "crates/core"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# heavy numeric deps are unusable in debug; optimise them even in dev builds
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ocrtrans-core]
opt-level = 3
